name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-cap-mco
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire la démonstration
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"
      - name: Mettre à jour la page publique
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/cap-mco-site gh-pages
          find /tmp/cap-mco-site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/cap-mco-site/
          touch /tmp/cap-mco-site/.nojekyll
          git -C /tmp/cap-mco-site config user.name "github-actions[bot]"
          git -C /tmp/cap-mco-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/cap-mco-site add --all
          git -C /tmp/cap-mco-site commit -m "Mettre à jour le site public"
          git -C /tmp/cap-mco-site push origin gh-pages
